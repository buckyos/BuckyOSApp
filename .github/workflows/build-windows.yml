name: Build BuckyOSApp Windows Staged Artifact

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'aarch64' && 'windows-11-arm' || 'windows-2025' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ inputs.arch }}-pc-windows-msvc
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build BuckyOSApp
        run: pnpm tauri build --no-bundle --no-sign --target ${{ inputs.arch }}-pc-windows-msvc
      - name: Prepare staged payload
        shell: pwsh
        run: |
          $stageRoot = Join-Path $env:RUNNER_TEMP 'staged'
          $payloadRoot = Join-Path $stageRoot 'BuckyOSApp'
          $archivePath = Join-Path $env:RUNNER_TEMP "buckyosapp-windows-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}.tar.gz"
          $sourcePath = 'src-tauri/target/${{ inputs.arch }}-pc-windows-msvc/release/buckyosapp.exe'
          if (Test-Path $stageRoot) {
            Remove-Item -Recurse -Force $stageRoot
          }
          New-Item -ItemType Directory -Force -Path $payloadRoot | Out-Null
          Copy-Item -Force $sourcePath (Join-Path $payloadRoot 'buckyosapp.exe')
          tar -czf $archivePath -C $stageRoot .
          if ($LASTEXITCODE -ne 0) {
            throw "tar failed with exit code $LASTEXITCODE"
          }
      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckyosapp-windows-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}
          path: ${{ runner.temp }}/buckyosapp-windows-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          compression-level: 0
