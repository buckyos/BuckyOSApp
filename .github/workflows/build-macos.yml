name: Build BuckyOSApp macOS Staged Artifact

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: macOS ${{ inputs.arch }}
    runs-on: ${{ inputs.arch == 'aarch64' && 'macos-15' || 'macos-15-intel' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.13.1'
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ inputs.arch }}-apple-darwin
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build BuckyOSApp
        run: pnpm tauri build --bundles app --no-sign --target ${{ inputs.arch }}-apple-darwin -- --locked
      - name: Prepare staged payload
        env:
          PAYLOAD_VERSION: ${{ inputs.version }}
          PAYLOAD_PLATFORM: ${{ inputs.arch == 'x86_64' && 'amd64-macos' || 'arm64-macos' }}
          STAGE_ROOT: ${{ runner.temp }}/staged
          ARCHIVE_PATH: ${{ runner.temp }}/buckyosapp-apple-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}.tar.gz
        run: |
          set -euxo pipefail
          rm -rf "$STAGE_ROOT"
          mkdir -p "$STAGE_ROOT/BuckyOSApp"
          cp -R "src-tauri/target/${{ inputs.arch }}-apple-darwin/release/bundle/macos/BuckyOS.app" "$STAGE_ROOT/BuckyOSApp/BuckyOS.app"
          python3 .github/scripts/write-install-descriptor.py \
            --component buckyosapp --root "$STAGE_ROOT/BuckyOSApp" \
            --version "$PAYLOAD_VERSION" --platform "$PAYLOAD_PLATFORM"
          tar -czf "$ARCHIVE_PATH" -C "$STAGE_ROOT" .
      - name: Upload staged artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckyosapp-apple-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}
          path: ${{ runner.temp }}/buckyosapp-apple-${{ inputs.arch == 'x86_64' && 'amd64' || 'aarch64' }}-${{ inputs.version }}.tar.gz
          if-no-files-found: error
          compression-level: 0
