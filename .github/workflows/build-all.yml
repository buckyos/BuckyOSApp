name: Build All BuckyOSApp Artifacts

on:
  workflow_dispatch:
    inputs:
      android_version_code:
        description: 'Android versionCode'
        required: true
        default: '1'
        type: string

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate BuckyOSApp version
        id: version
        run: |
          base_version="$(node -p "require('./package.json').version")"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$base_version+build$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"
  build-windows:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.prepare-version.outputs.artifact_version }}
  build-macos:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.prepare-version.outputs.artifact_version }}
  build-android:
    needs: prepare-version
    uses: ./.github/workflows/build-android.yml
    with:
      version_name: ${{ needs.prepare-version.outputs.base_version }}
      artifact_version: ${{ needs.prepare-version.outputs.artifact_version }}
      version_code: ${{ inputs.android_version_code }}
