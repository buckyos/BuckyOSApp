name: Build All BuckyOSApp Artifacts

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      android_version_code:
        description: 'Android versionCode'
        required: true
        default: '1'
        type: string

jobs:
  prepare-version:
    runs-on: ubuntu-latest
    outputs:
      base_version: ${{ steps.version.outputs.base_version }}
      artifact_version: ${{ steps.version.outputs.artifact_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate BuckyOSApp version
        id: version
        run: |
          base_version="$(node -p "require('./package.json').version")"
          echo "base_version=$base_version" >> "$GITHUB_OUTPUT"
          echo "artifact_version=$base_version+build$(date -u +%y%m%d)" >> "$GITHUB_OUTPUT"
  build-windows:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64"]
    uses: ./.github/workflows/build-windows.yml
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.prepare-version.outputs.artifact_version }}
  build-macos:
    needs: prepare-version
    strategy:
      fail-fast: false
      matrix:
        arch: ["x86_64", "aarch64"]
    uses: ./.github/workflows/build-macos.yml
    with:
      arch: ${{ matrix.arch }}
      version: ${{ needs.prepare-version.outputs.artifact_version }}
  build-android:
    needs: prepare-version
    uses: ./.github/workflows/build-android.yml
    with:
      version_name: ${{ needs.prepare-version.outputs.base_version }}
      artifact_version: ${{ needs.prepare-version.outputs.artifact_version }}
      version_code: ${{ github.event_name == 'workflow_dispatch' && inputs.android_version_code || '1' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  upload-payloads:
    name: Upload component payloads to R2
    needs: [build-windows, build-macos, build-android]
    if: github.ref == 'refs/heads/main' && github.repository == 'buckyos/buckyosapp'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
    concurrency:
      group: payload-r2-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download component payloads
        uses: actions/download-artifact@v6
        with:
          pattern: buckyosapp-*
          merge-multiple: true
          path: ${{ runner.temp }}/payloads
      - name: Upload component payloads to R2
        uses: ryand56/r2-upload-action@latest
        with:
          r2-account-id: 87e0bdf811b13ee87fd0bcec7a4fd1e7
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-bucket: buckyos-installer
          source-dir: ${{ runner.temp }}/payloads
          destination-dir: buckyosapp/
          keep-file-fresh: false
          output-file-url: false
