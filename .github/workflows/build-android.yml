name: Build BuckyOS Android APK

on:
  workflow_call:
    inputs:
      version_name:
        description: Version name for Android artifacts
        required: true
        type: string
      artifact_version:
        description: Version label used in the stored APK filename
        required: true
        type: string
      version_code:
        description: Version code for Android artifacts
        required: true
        default: "1"
        type: string

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NDK_VERSION: "27.0.12077973"
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Write Android version properties
        run: |
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          tauri.android.versionName=${{ inputs.version_name }}
          tauri.android.versionCode=${{ inputs.version_code }}
          EOF

      - name: Build Android APK
        run: pnpm tauri android build -t aarch64 --apk --ci -v

      - name: Prepare unsigned APK
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*debug*' | sort | tail -n 1)"
          test -n "$apk"
          if "$BUILD_TOOLS/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo "Android build unexpectedly produced an already signed APK: $apk" >&2
            exit 1
          fi
          output="$RUNNER_TEMP/buckyosapp-android-arm64-${{ inputs.artifact_version }}.apk"
          if "$BUILD_TOOLS/zipalign" -c -P 16 4 "$apk"; then
            cp "$apk" "$output"
          else
            "$BUILD_TOOLS/zipalign" -P 16 -f 4 "$apk" "$output"
          fi
          "$BUILD_TOOLS/aapt2" dump badging "$output" >/dev/null
          if "$BUILD_TOOLS/apksigner" verify "$output" >/dev/null 2>&1; then
            echo "Prepared Android Artifact must remain unsigned: $output" >&2
            exit 1
          fi

      - name: Upload unsigned APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckyosapp-android-arm64-${{ inputs.artifact_version }}
          path: ${{ runner.temp }}/buckyosapp-android-arm64-${{ inputs.artifact_version }}.apk
          if-no-files-found: error
          compression-level: 0
