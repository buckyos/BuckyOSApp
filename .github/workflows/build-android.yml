name: Build BuckyOS Android APK

on:
  workflow_call:
    inputs:
      version_name:
        description: Version name for Android artifacts
        required: true
        type: string
      artifact_version:
        description: Version label used in the stored APK filename
        required: true
        type: string
      version_code:
        description: Version code for Android artifacts
        required: true
        default: "1"
        type: string

    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      NDK_VERSION: "27.0.12077973"
      NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
      NDK_ROOT: /usr/local/lib/android/sdk/ndk/27.0.12077973
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.13.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"

      - name: Install frontend dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci

      - name: Write Android version properties
        run: |
          cat > src-tauri/gen/android/app/tauri.properties <<EOF
          tauri.android.versionName=${{ inputs.version_name }}
          tauri.android.versionCode=${{ inputs.version_code }}
          EOF

      - name: Build and verify signed Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ARTIFACT_VERSION: ${{ inputs.artifact_version }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/android-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          export ANDROID_KEYSTORE_PATH="$signing_dir/keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          unset ANDROID_KEYSTORE_BASE64
          pnpm tauri android build -t aarch64 --apk --ci -v -- --locked
          unset ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_KEYSTORE_PATH
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          apk="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' ! -name '*debug*' | sort | tail -n 1)"
          test -n "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"
          "$build_tools/aapt2" dump badging "$apk" >/dev/null
          cp "$apk" "$RUNNER_TEMP/buckyosapp-android-arm64-$ARTIFACT_VERSION.apk"

      - name: Upload signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: buckyosapp-android-arm64-${{ inputs.artifact_version }}
          path: ${{ runner.temp }}/buckyosapp-android-arm64-${{ inputs.artifact_version }}.apk
          if-no-files-found: error
          compression-level: 0
