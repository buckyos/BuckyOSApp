[package]
license = "AGPL-3.0-only"
name = "buckyosapp"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "buckyosapp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.5.6", features = [] }

# Builds the Swift side of the client (ios/ClientPlugin); the version tauri already uses.
[target.'cfg(target_os = "macos")'.build-dependencies]
tauri-utils = { version = "2.8", features = ["build"] }

[dev-dependencies]
tauri = { version = "=2.10.3", features = ["test"] }

[dependencies]
tauri = { version = "=2.10.3", features = ["tray-icon", "image-png"] }
# Pinned to match tauri 2.10.3 — newer 2.11.x breaks an internal trait
# bound and won't compile against this tauri version.
tauri-runtime = "=2.10.1"
tauri-runtime-wry = "=2.10.1"
tauri-plugin-store = "=2.4.0"
tauri-plugin-opener = "=2.5.0"
tauri-plugin-log = "=2.8.0"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0"
thiserror = "1.0"
bip39 = "2.0"
bitcoin = { version = "0.31.1", features = ["rand-std", "serde"] }
sha3 = "0.10"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
ulid = "1.1"
name-lib = { git = "https://github.com/buckyos/buckyos-base.git", package = "name-lib", branch = "main" }
name-client = { git = "https://github.com/buckyos/buckyos-base.git", package = "name-client", branch = "main" }
buckyos-kit = { git = "https://github.com/buckyos/buckyos-base.git", package = "buckyos-kit", branch = "main" }
secrecy = "0.8"
zeroize = "1.7"
jsonwebtoken = { version = "9", default-features = false, features = ["use_pem"] }
if-addrs = "*"
tauri-plugin-http = "=2.5.4"
futures = "0.3"
# A Zone may use a certificate of a private CA the system trusts: WebViews accept it, so the
# client's own requests have to as well.
reqwest = { version = "0.12", default-features = false, features = ["http2", "json", "rustls-tls", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
base64 = "0.22"
url = "2"
tauri-plugin-deep-link = "=2.4.5"

# Used by the vendored node_control module (Unix setsid, kill and user lookups).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# NativeBridge.kt, and the runtime of the notification process (notify/service.rs).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
tokio = { version = "1", features = ["net", "rt-multi-thread"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Used to reach the WKWebView scroll view (see ios_webview.rs).
objc2 = "0.6"
# The system keychain (zone/secret.rs).
keyring = { version = "3", default-features = false, features = ["apple-native"] }
# iOS cannot list the roots it trusts, so the system itself checks certificates (http_client.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"

# Desktop processes must be single-instance so repeated launches reuse the
# existing main window instead of creating another window and tray icon.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-autostart = "=2.5.1"

# The system keychain (zone/secret.rs).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
# Toasts whose click comes back (notify/alerts/windows.rs); the version tauri already uses.
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
windows-registry = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSError", "NSString"] }
objc2-user-notifications = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
